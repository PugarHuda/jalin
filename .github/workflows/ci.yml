name: tests

# The suite is the claim. Running it here means the claim is checked on a machine
# that has none of this developer's state, on every push, and anyone reading the
# repository can see whether it currently holds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sdk:
    name: sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The SDK ships TypeScript with explicit .ts specifiers so node runs it
      # with no build step. That is the property under test as much as the logic.
      - run: npm install --no-audit --no-fund
      - run: npm test

      # Every path this repository names, checked against the repository. A
      # comment pointing at a document nobody wrote sends the reader looking for
      # an explanation that does not exist; two were live before this ran.
      - run: npm run check:links

      # Every test count the prose quotes, against the suites that produce them.
      # Four stale test counts and one stale transaction count went out before
      # this existed, the last of them claiming every listed mainnet transaction
      # ran through the router when one had gone through the governor.
      - run: npm run check:counts

      # The SDK ships TypeScript source, so nothing compiles it before it is
      # published. tsc is the only thing that reads the files nobody imports.
      - run: npm run typecheck

      # Unused files, unused exports, and imports of packages no manifest
      # declares. It found five scripts importing starknet that only resolved
      # because the app workspace hoisted it.
      - run: npm run check:dead

  app:
    name: app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      # next build runs TypeScript itself. A separate tsc step would also need
      # .next/types, which does not exist until the build has produced it.
      - run: npm run build --workspace app

      # Configured since the first commit and never once run, which is how six
      # errors accumulated in it.
      - run: npm run lint

  e2e:
    name: browser
    runs-on: ubuntu-latest
    env:
      # A public Starknet mainnet node, so this runs on a fork with no secrets.
      # The suite reads the chain for real - there are no fixtures in it - so
      # without a node there is nothing to test rather than something to mock.
      STARKNET_RPC_URL: ${{ secrets.STARKNET_RPC_URL || 'https://rpc.starknet.lava.build:443' }}
      ROUTER_ADDRESS: '0x008498d79ca390b34a6416cc45fb375ad9b921eefd8d4531d99a2d775feb3a7e'
      GOVERNOR_ADDRESS: '0x05bd985e794aee4c12d529ab50a68e5a40c7e28a36642b2b8e2ccdb373346984'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      # Three engines. Chromium alone cannot see a Gecko or WebKit layout
      # difference, and this page leans on grid, color-mix, mask-image and a
      # masked SVG - all places the three disagree.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

      # Impeccable's detector - 59 deterministic rules over a headless render -
      # as a gate, the way cairo-coverage and verify-classes already are. It
      # reads the build the suite just tested, at desktop width and at a
      # phone's. Thirty findings the first time it ran; zero is the bar now,
      # and the one recorded exception sits in .impeccable/config.json with its
      # reason beside it, where the detector reads it and a reviewer can too.
      - name: Design defects are build failures
        run: |
          npm run start --workspace app -- --port 3100 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:3100 && break; sleep 1; done
          npx -y impeccable detect \
            http://127.0.0.1:3100 \
            http://127.0.0.1:3100/compose \
            http://127.0.0.1:3100/governance \
            http://127.0.0.1:3100/verify
          npx -y impeccable detect --viewport 390x844 http://127.0.0.1:3100/compose
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  contracts:
    name: cairo
    runs-on: ubuntu-latest
    env:
      SCARB_VERSION: 2.20.0
      FOUNDRY_VERSION: 0.63.0
      USC_VERSION: 2.10.0
      COVERAGE_VERSION: 0.6.1
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same versions as contracts/Dockerfile. A class hash is a
      # function of the compiler, so an unpinned toolchain would quietly produce
      # a different contract from the one deployed.
      - name: Install scarb
        run: |
          curl -fsSL "https://github.com/software-mansion/scarb/releases/download/v${SCARB_VERSION}/scarb-v${SCARB_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /opt
          echo "/opt/scarb-v${SCARB_VERSION}-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Install starknet-foundry
        run: |
          curl -fsSL "https://github.com/foundry-rs/starknet-foundry/releases/download/v${FOUNDRY_VERSION}/starknet-foundry-v${FOUNDRY_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /opt
          echo "/opt/starknet-foundry-v${FOUNDRY_VERSION}-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"

      # snforge shells out to this to compile Sierra for the test runner.
      - name: Install universal-sierra-compiler
        run: |
          curl -fsSL "https://github.com/software-mansion/universal-sierra-compiler/releases/download/v${USC_VERSION}/universal-sierra-compiler-v${USC_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /opt
          find /opt -name universal-sierra-compiler -type f -exec dirname {} \; | head -1 >> "$GITHUB_PATH"

      - run: scarb build
        working-directory: contracts

      - name: Install cairo-coverage
        run: |
          curl -fsSL "https://github.com/software-mansion/cairo-coverage/releases/download/v${COVERAGE_VERSION}/cairo-coverage-v${COVERAGE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /opt
          find /opt -name cairo-coverage -type f -exec dirname {} \; | head -1 >> "$GITHUB_PATH"

      # The fork tests read mainnet through a public node, so this needs network
      # but no key.
      - run: snforge test --coverage --profile coverage
        working-directory: contracts

      - name: Every contract line runs
        run: node scripts/coverage-gate.mjs

      # scarb build last, because snforge overwrites the release artifact with a
      # test build of the same contract - which is how a class hash computed
      # after testing stops matching what was declared.
      - run: scarb build
        working-directory: contracts

      - name: Deployed classes are this source
        env:
          # Falls back to a public node rather than skipping. This check is the
          # one that says the contracts on mainnet are the contracts you are
          # reading, and a skipped check proves nothing.
          STARKNET_RPC_URL: ${{ secrets.STARKNET_RPC_URL || 'https://rpc.starknet.lava.build:443' }}
        run: |
          npm install --no-audit --no-fund
          node scripts/verify-classes.mjs
        working-directory: ${{ github.workspace }}
